services:
  db:
    image: postgres:16
    container_name: social_studio_db
    environment:
      POSTGRES_USER: socialstudio
      POSTGRES_PASSWORD: socialstudio
      POSTGRES_DB: socialstudio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialstudio -d socialstudio"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: social_studio_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://socialstudio:socialstudio@db:5432/socialstudio
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: